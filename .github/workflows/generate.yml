name: generate

# Generates original instrumental deep house with ACE-Step 1.5 on GitHub's CPU runners
# and adds every track that passes the quality check to the `library` release.
# The channel (channel-engine) downloads that release before each daily video.
on:
  workflow_dispatch:
    inputs:
      shards:
        description: Parallel jobs (1-20)
        default: "12"
      per_shard:
        description: Tracks per job (about 45-50 min each on CPU; 5 fit in a job)
        default: "5"
      seconds:
        description: Length of each track in seconds (the model tops out near 242 s, so 230 is the longest that passes)
        default: "230"
      model:
        description: ACE-Step DiT (acestep-v15-xl-turbo = best quality, acestep-v15-turbo = faster)
        default: acestep-v15-xl-turbo
      lm:
        description: Planner LM (acestep-5Hz-lm-1.7B, acestep-5Hz-lm-0.6B or none)
        default: acestep-5Hz-lm-1.7B
      publish:
        description: Add to the library release (off = only to a lab branch to listen first)
        type: boolean
        default: true
  # Automatic top-up, no human needed: 16 jobs x 5 tracks every Sunday = ~80 new tracks a
  # week, more than the 4 videos a week the channel publishes (each uses its own ~16 tracks).
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      per_shard: ${{ steps.p.outputs.per_shard }}
      seconds: ${{ steps.p.outputs.seconds }}
    steps:
      - id: p
        env:
          SHARDS: ${{ inputs.shards || '16' }}
          PER: ${{ inputs.per_shard || '5' }}
          SECS: ${{ inputs.seconds || '230' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(( SHARDS < 1 ? 1 : (SHARDS > 20 ? 20 : SHARDS) ))
          echo "shards=$(seq -s, 1 $n | sed 's/^/[/;s/$/]/')" >> "$GITHUB_OUTPUT"
          echo "per_shard=$PER" >> "$GITHUB_OUTPUT"
          echo "seconds=$SECS" >> "$GITHUB_OUTPUT"
          gh release view library -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create library \
            -R "$GITHUB_REPOSITORY" --title "FOCUS & CO music library" \
            --notes "Original instrumental deep house generated with ACE-Step 1.5. Used by the FOCUS & CO channel."

  generate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make room for the models
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 8G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap -q /swapfile2 && sudo swapon /swapfile2
          nproc; free -g | head -2
      - name: Install ACE-Step 1.5 (CPU, inference only)
        run: |
          git clone --depth 1 https://github.com/ace-step/ACE-Step-1.5 ace
          cd ace
          pip install -q torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 \
            --index-url https://download.pytorch.org/whl/cpu
          grep -vE "^(#|--|torch==|torchvision|torchaudio==|flash-attn|triton|mlx|peft|lycoris|lightning|tensorboard|safetensors==)" \
            requirements.txt | sed '/^\s*$/d' > req-cpu.txt
          pip install -q -r req-cpu.txt safetensors pytorch_wavelets PyWavelets imageio-ffmpeg \
            --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -q --no-deps -e .
          pip install -q --no-deps -e acestep/third_parts/nano-vllm || true
          # bfloat16 on CPU: the XL model and the planner LM fit in the runner's RAM.
          sed -i 's/torch.bfloat16 if resolved_device == "xpu" else torch.float32/torch.bfloat16/' \
            acestep/core/generation/handler/init_service_orchestrator.py
      - name: Generate
        working-directory: ace
        env:
          # ACE-Step gives up after 10 minutes by default; the XL model on CPU needs longer.
          ACESTEP_GENERATION_TIMEOUT: "3000"
        run: |
          set -o pipefail
          seed=$(( $(date +%s) % 50000 + ${{ matrix.shard }} * 97 ))
          python ../generate.py --out ../out --count ${{ needs.plan.outputs.per_shard }} \
            --seconds ${{ needs.plan.outputs.seconds }} --seed "$seed" \
            --shard ${{ matrix.shard }} --run-seed ${{ github.run_id }} --catalog ../catalog/tracks.json \
            --model "${{ inputs.model || 'acestep-v15-xl-turbo' }}" --lm "${{ inputs.lm || 'acestep-5Hz-lm-1.7B' }}" \
            > ../generate.log 2>&1 || true
          grep -E "^(dit init|lm init|track|kept)" ../generate.log || tail -40 ../generate.log
          # Say it loudly when a shard produced nothing (the job itself keeps going).
          ls ../out/*.mp3 >/dev/null 2>&1 || echo "::error title=shard ${{ matrix.shard }}::no track kept — $(grep -E '^track' ../generate.log | tail -1)"
      - name: Push to a lab branch (listen before publishing)
        if: always() && inputs.publish == false
        run: |
          mkdir -p out && cp generate.log out/ || true
          cd out && rm -rf raw *.wav
          git init -q -b lab && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "lab ${{ github.run_id }} shard ${{ matrix.shard }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" \
            "HEAD:lab-${{ github.run_id }}-${{ matrix.shard }}"
      - name: Add to the library release
        if: always() && inputs.publish != false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(out/*.mp3 out/tracks-*.json)
          [ ${#files[@]} -gt 0 ] && gh release upload library "${files[@]}" --clobber -R "$GITHUB_REPOSITORY"
          grep -E "^(track|kept)" generate.log | tail -30 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' \
            | xargs -0 -I{} echo "::notice title=shard ${{ matrix.shard }}::{}" || true

  catalog:
    # After every publishing run: rebuild catalog/tracks.json + tracks.csv from the release.
    needs: generate
    if: always() && inputs.publish != false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p manifests
          gh release download library -R "$GITHUB_REPOSITORY" -p 'tracks-*.json' -D manifests --clobber
          python3 catalog.py manifests
          git add catalog
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "catalog: $(python3 -c 'import json;print(len(json.load(open("catalog/tracks.json"))))') tracks"
          git push -q origin HEAD:main
